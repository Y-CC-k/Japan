<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>閱讀報告引導單</title>
<style>
  body { font-family: "Microsoft JhengHei","Noto Sans TC",sans-serif; max-width: 720px; margin: 20px auto; padding: 20px; color: #2c3e50; }
  h1 { text-align: center; }
  .q { margin: 16px 0 4px; font-weight: 700; }
  .guide { margin: 4px 0 12px; padding: 8px 12px; background: #f0f4f8; border-left: 4px solid #3498db; border-radius: 4px; }
  .blank { display: inline-block; border-bottom: 1.5px solid #2c3e50; min-width: 200px; height: 1.4em; vertical-align: bottom; }
  .long { display: block; border-bottom: 1.5px solid #2c3e50; min-height: 1.4em; margin: 4px 0 8px; }
  .stars { font-size: 24px; letter-spacing: 6px; color: #f39c12; }
  .checkbox { display: inline-block; width: 16px; height: 16px; border: 1.5px solid #2c3e50; margin: 0 4px; vertical-align: middle; }
  @media print { body { margin:0; } .no-print { display:none; } }
</style>
</head>
<body>
  <h1>📰 閱讀報告引導單</h1>
  <p class="no-print" style="text-align:center;"><a href="index.html">← 返回</a></p>

  <div class="q">第一句：我看了哪一篇新聞或故事？</div>
  <div class="guide">✏️ 引導句：我今天在國語日報上，看到了一篇叫做《<span class="blank"></span>》的文章。</div>

  <div class="q">第二句：裡面發生了什麼事？</div>
  <div class="guide">✏️ 引導句：這篇文章主要在講（誰／什麼東西）<span class="long"></span>。</div>

  <div class="q">第三句：我覺得這件事很酷或很奇怪的地方！</div>
  <div class="guide">
    ✏️ 引導句：我覺得最（<span class="checkbox"></span>很酷 <span class="checkbox"></span>很奇怪 <span class="checkbox"></span>好笑 <span class="checkbox"></span>感動）的地方是，<span class="long"></span>。<br>
    🌟 我的推薦指數： <span class="stars">☆ ☆ ☆ ☆ ☆</span>（請幫這篇文章塗上星星顏色）
  </div>

  <p style="margin-top:24px; text-align:center; color:#7f8c8d; font-size:13px;">姓名：＿＿＿＿＿＿　班級：＿＿＿＿　日期：＿＿＿＿</p>
</body>
</html>
