<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多語鍵盤練習</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; padding:0; font-family: "Microsoft JhengHei","Noto Sans TC",sans-serif; background:#f0f4f8; color:#2c3e50; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .wrap { max-width:600px; width:90%; text-align:center; }
  h1 { font-size:32px; color:#2c3e50; }
  .card { background:#fff; border-radius:16px; padding:24px; margin:12px 0; box-shadow:0 6px 18px rgba(0,0,0,0.07); }
  .card h2 { margin:0 0 8px; }
  .card p { color:#7f8c8d; margin:0 0 12px; }
  .card a { display:inline-block; padding:10px 20px; background:#3498db; color:#fff; text-decoration:none; border-radius:8px; font-weight:700; }
  .card a:hover { background:#2980b9; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>🎹 多語鍵盤練習</h1>
    <p>選擇語言開始練習</p>
    <div class="card">
      <h2>🇺🇸 English (ABC)</h2>
      <p>英文字母發音與鍵盤位置練習</p>
      <a href="en.html">開始練習</a>
    </div>
    <div class="card">
      <h2>🇯🇵 日本語</h2>
      <p>日式 JIS 鍵盤與假名發音練習</p>
      <a href="ja.html">開始練習</a>
    </div>
  </div>
</body>
</html>
